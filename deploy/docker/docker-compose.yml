version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AgentForge — Docker Compose
#
# Starts:
#   postgres    — primary database
#   redis       — HITL queue backend + rate limit state
#   agentforge  — API server (FastAPI)
#   nginx       — reverse proxy + TLS termination (optional)
#
# Usage:
#   cp .env.example .env   # edit secrets
#   docker compose up -d
#   open http://localhost
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agentforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentforge-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentforge-net

  # ── AgentForge API ──────────────────────────────────────────────────────────
  agentforge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: agentforge-api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://agentforge:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agentforge
      # Auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-CHANGE_ME_IN_PRODUCTION}
      AIAM_SIGNING_SECRET: ${AIAM_SIGNING_SECRET:-CHANGE_ME_IN_PRODUCTION}
      # App
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_JSON: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMETHEUS_ENABLED: "true"
      # Notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      # OAuth
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - agentforge_logs:/app/logs
    networks:
      - agentforge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agentforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro          # mount your TLS certs here
    depends_on:
      - agentforge
    networks:
      - agentforge-net

volumes:
  postgres_data:
  redis_data:
  agentforge_logs:

networks:
  agentforge-net:
    driver: bridge
