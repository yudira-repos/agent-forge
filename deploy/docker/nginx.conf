upstream agentforge_upstream {
    server agentforge:8000;
    keepalive 32;
}

# Local dev: HTTP only (no certs needed)
# Production: swap this for the nginx.prod.conf which adds TLS
server {
    listen 80;
    server_name _;

    # Security headers (even in dev)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Proxy to AgentForge API + UI
    location / {
        proxy_pass         http://agentforge_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }

    # WebSocket support for real-time events
    location /ws/ {
        proxy_pass         http://agentforge_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
