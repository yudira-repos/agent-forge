apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-api
  namespace: agentforge
  labels:
    app: agentforge-api
    version: "0.1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentforge-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploys
  template:
    metadata:
      labels:
        app: agentforge-api
        version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agentforge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: agentforge
          image: ghcr.io/yudira-repos/agent-forge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: jwt-secret-key
            - name: AIAM_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: aiam-signing-secret
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_JSON
              value: "true"
            - name: PROMETHEUS_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: agentforge-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      initContainers:
        - name: run-migrations
          image: ghcr.io/yudira-repos/agent-forge:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: database-url
