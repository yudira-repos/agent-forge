[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Open Enterprise Agent Framework — identity, governance, audit, and HITL for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "agents", "ai", "enterprise", "governance", "audit",
    "hitl", "llm", "anthropic", "openai", "langchain", "vertex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core has zero mandatory dependencies — all LLM SDKs are optional
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
langchain = ["langchain-core>=0.2", "langchain-openai>=0.1"]
langgraph = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.2",
]
vertex = ["google-cloud-aiplatform>=1.60"]
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-semantic-conventions>=0.45b0",
]
all = [
    "anthropic>=0.30",
    "openai>=1.30",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "google-cloud-aiplatform>=1.60",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-semantic-conventions>=0.45b0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "coverage[toml]>=7.5",
]

[project.urls]
Homepage = "https://github.com/yudira-repos/agent-forge"
Documentation = "https://github.com/yudira-repos/agent-forge#readme"
Repository = "https://github.com/yudira-repos/agent-forge"
"Bug Tracker" = "https://github.com/yudira-repos/agent-forge/issues"
Changelog = "https://github.com/yudira-repos/agent-forge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["ui/", "tests/"]

[tool.coverage.run]
source = ["agentforge"]
omit = [
    "tests/*",
    # Adapters require real API keys — tested via integration tests, not unit CI
    "agentforge/runtime/adapters/anthropic.py",
    "agentforge/runtime/adapters/openai.py",
    "agentforge/runtime/adapters/langchain.py",
    "agentforge/runtime/adapters/vertex.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
