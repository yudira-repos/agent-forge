# Railway deployment — Dockerfile builder (FastAPI app is at ui/backend/main.py).
#
# Networking fix for 502 "Application failed to respond":
#   1. agentforge → Variables → set PORT=8000 (or delete PORT and use Railway default)
#   2. Settings → Networking → edit domain → target port MUST match PORT (use 8000, not 80)
#   3. Redeploy, then: curl https://YOUR-DOMAIN.up.railway.app/health

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
